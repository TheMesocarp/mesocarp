[package]

authors     = ["Mesocarp"]
description = "High-performance concurrency, synchronization, scheduling, and logging primitives in Rust"
edition     = "2021"
homepage    = "https://github.com/TheMesocarp/mesocarp"
keywords    = ["concurrency", "synchronization", "scheduling", "logging"]
license     = "LGPL-2.1"
name        = "mesocarp"
readme      = "README.md"
repository  = "https://github.com/TheMesocarp/mesocarp"
version     = "0.11.0"

[dependencies]
array-init = "2.1.0"
bytemuck   = "1.24.0"
loom       = "0.7.2"
thiserror  = "2.0.17"

[dev-dependencies]
bincode = { version = "2.0.1", features = ["derive"] }
loom    = "0.7.2"

[features]
loom = []
